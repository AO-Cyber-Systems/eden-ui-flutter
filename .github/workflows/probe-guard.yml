# Own workflow, deliberately NOT a job in ci.yml: ci.yml is edited by other
# TRDs in this objective and a second editor on one file is how wave conflicts
# happen. Row 1a-07's gate says "CI probe-guard job" and does not name ci.yml.
name: Probe Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# The GITHUB_TOKEN this workflow hands to every step. Set explicitly so the
# workflow defends itself: the repository default is currently `read`, but that
# is a repo setting anyone can flip to `write` without touching a file here or
# opening a diff. None of these jobs writes anything -- they check out, install
# Flutter, run tests and upload artifacts (which uses its own runtime token, not
# this one). Flagged by CodeQL actions/missing-workflow-permissions.
permissions:
  contents: read

jobs:
  probe-guard:
    name: Probe bundle guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # PINNED to the version CI was already resolving `stable` to, so this
          # changes nothing about what runs today -- it stops the toolchain
          # moving under the repo tomorrow.
          #
          # Why this matters here specifically: correctness in this tree is
          # SDK-dependent. On 3.47.4 ReorderableListView.onReorder is nullable,
          # so `rlv.onReorder!(...)` in eden_route_stop_list_test.dart is
          # REQUIRED; on the older 3.41.4 that same `!` is an
          # unnecessary_non_null_assertion warning. dfe1698 removed it on the
          # strength of a local warning and 30cb437 had to restore it after CI
          # failed with unchecked_use_of_nullable_value. An unpinned channel
          # means a future stable can flip that again through nobody's commit.
          #
          # Do NOT lower this pin without changing that source in the same
          # commit -- they are one decision, not two.
          # BUMPED WITH pubspec.yaml's floor, not independently. main's
          # toolchain-alignment commit (f9107c3) raised `sdk: ^3.13.4` /
          # `flutter: >=3.47.5` and bumped the two pins main's OWN ci.yml has.
          # This job (and `stories`, and probe-guard.yml) is added by this
          # branch, so its pin stayed at 3.47.4 -- Dart 3.13.3 -- and `flutter
          # pub get` could no longer resolve the package at all. The job died
          # before running its gate, which is the worst way for a gate to
          # fail: red for a reason that has nothing to do with what it checks.
          flutter-version: '3.47.5'
          cache: true

      # The library itself, then the example that depends on it by path.
      - run: flutter pub get

      - run: flutter pub get
        working-directory: example/probe_smoke

      - name: Build twice and grep the bundle
        run: bash tool/probe_guard.sh example/probe_smoke
