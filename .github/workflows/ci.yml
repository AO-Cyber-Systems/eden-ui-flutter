name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      update_goldens:
        description: >-
          Regenerate the story golden baselines on this Linux runner and upload
          them as an artifact. This is the ONLY path in the repo that writes
          goldens -- see the `stories` job comment.
        type: boolean
        default: false

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # PINNED to the version CI was already resolving `stable` to, so this
          # changes nothing about what runs today -- it stops the toolchain
          # moving under the repo tomorrow.
          #
          # Why this matters here specifically: correctness in this tree is
          # SDK-dependent. On 3.47.4 ReorderableListView.onReorder is nullable,
          # so `rlv.onReorder!(...)` in eden_route_stop_list_test.dart is
          # REQUIRED; on the older 3.41.4 that same `!` is an
          # unnecessary_non_null_assertion warning. dfe1698 removed it on the
          # strength of a local warning and 30cb437 had to restore it after CI
          # failed with unchecked_use_of_nullable_value. An unpinned channel
          # means a future stable can flip that again through nobody's commit.
          #
          # Do NOT lower this pin without changing that source in the same
          # commit -- they are one decision, not two.
          flutter-version: '3.47.5'
          cache: true

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # PINNED to the version CI was already resolving `stable` to, so this
          # changes nothing about what runs today -- it stops the toolchain
          # moving under the repo tomorrow.
          #
          # Why this matters here specifically: correctness in this tree is
          # SDK-dependent. On 3.47.4 ReorderableListView.onReorder is nullable,
          # so `rlv.onReorder!(...)` in eden_route_stop_list_test.dart is
          # REQUIRED; on the older 3.41.4 that same `!` is an
          # unnecessary_non_null_assertion warning. dfe1698 removed it on the
          # strength of a local warning and 30cb437 had to restore it after CI
          # failed with unchecked_use_of_nullable_value. An unpinned channel
          # means a future stable can flip that again through nobody's commit.
          #
          # Do NOT lower this pin without changing that source in the same
          # commit -- they are one decision, not two.
          flutter-version: '3.47.5'
          cache: true

      - run: flutter pub get

      - run: flutter test

  lint:
    name: Lint (design rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # PINNED to the version CI was already resolving `stable` to, so this
          # changes nothing about what runs today -- it stops the toolchain
          # moving under the repo tomorrow.
          #
          # Why this matters here specifically: correctness in this tree is
          # SDK-dependent. On 3.47.4 ReorderableListView.onReorder is nullable,
          # so `rlv.onReorder!(...)` in eden_route_stop_list_test.dart is
          # REQUIRED; on the older 3.41.4 that same `!` is an
          # unnecessary_non_null_assertion warning. dfe1698 removed it on the
          # strength of a local warning and 30cb437 had to restore it after CI
          # failed with unchecked_use_of_nullable_value. An unpinned channel
          # means a future stable can flip that again through nobody's commit.
          #
          # Do NOT lower this pin without changing that source in the same
          # commit -- they are one decision, not two.
          # BUMPED WITH pubspec.yaml's floor, not independently. main's
          # toolchain-alignment commit (f9107c3) raised `sdk: ^3.13.4` /
          # `flutter: >=3.47.5` and bumped the two pins main's OWN ci.yml has.
          # This job (and `stories`, and probe-guard.yml) is added by this
          # branch, so its pin stayed at 3.47.4 -- Dart 3.13.3 -- and `flutter
          # pub get` could no longer resolve the package at all. The job died
          # before running its gate, which is the worst way for a gate to
          # fail: red for a reason that has nothing to do with what it checks.
          flutter-version: '3.47.5'
          cache: true

      - run: flutter pub get

      # `lints/` is a separate package; custom_lint needs it resolved too.
      - run: dart pub get --directory=lints

      # THE RULES' OWN TESTS. `lints/` is a separate package, so the root
      # `flutter test` never walked it and `lints/test/rules_test.dart` -- the
      # only thing that proves the three rules fire on a violation and stay
      # quiet on a clean file -- had NEVER been executed in CI. A rule nobody
      # runs is a rule nobody knows works.
      - name: Design-rule unit tests
        run: dart test
        working-directory: lints

      # THE GATE. Non-zero when any of the three design rules fires inside the
      # enforced scope declared in analysis_options.yaml. Deliberately NOT
      # continue-on-error: a non-blocking gate is the exact failure mode this
      # job exists to avoid.
      - run: dart run custom_lint

      # THE NON-VACUITY CONTROL, and it runs AFTER the gate on purpose: it
      # writes a deliberately-violating file into the enforced scope, so a
      # leftover from a crashed run must not be able to poison the real gate
      # above (the script traps and deletes it either way).
      #
      # `dart run custom_lint` exits 0 both when the rules hold and when they
      # are not running -- a missing `plugins: custom_lint`, a duplicate
      # top-level `analyzer:` key, or `enforced_paths` indented one level too
      # far. All three have happened. This step fails if the gate stays quiet
      # on a file that must be reported.
      - name: Lint gate non-vacuity control
        run: bash tool/lint_gate_assert.sh

  stories:
    name: Stories (goldens + expectUiSane)
    runs-on: ubuntu-latest
    # GOLDEN POLICY -- this job is where goldens live, and nowhere else.
    #
    # Story goldens are generated and compared HERE, on Linux, at the same
    # pinned 3.47.4 the other jobs use. A workstation checkout runs 3.41.9 and
    # bundles no fonts, so the emitted golden expectations carry
    # `skip: kGoldenSkipReason`, which is non-null off Linux -- they SKIP on a
    # macOS `flutter test` and are reported as skips, not as passes. The
    # `expectUiSane` half of every story test is NOT skipped and runs on every
    # platform, so a local run still proves the catalogue's a11y and geometry.
    #
    # Blessing a baseline on a workstation is exactly eden-ui-flutter#32:
    # different engines rasterise text differently, and chat_screen_test's
    # 390pt overflow assertion already passes here and fails locally by 8.5px.
    # Do NOT run `flutter test --update-goldens` outside this job.
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # PINNED to the version CI was already resolving `stable` to, so this
          # changes nothing about what runs today -- it stops the toolchain
          # moving under the repo tomorrow.
          #
          # Why this matters here specifically: correctness in this tree is
          # SDK-dependent. On 3.47.4 ReorderableListView.onReorder is nullable,
          # so `rlv.onReorder!(...)` in eden_route_stop_list_test.dart is
          # REQUIRED; on the older 3.41.4 that same `!` is an
          # unnecessary_non_null_assertion warning. dfe1698 removed it on the
          # strength of a local warning and 30cb437 had to restore it after CI
          # failed with unchecked_use_of_nullable_value. An unpinned channel
          # means a future stable can flip that again through nobody's commit.
          #
          # Do NOT lower this pin without changing that source in the same
          # commit -- they are one decision, not two.
          # BUMPED WITH pubspec.yaml's floor, not independently. main's
          # toolchain-alignment commit (f9107c3) raised `sdk: ^3.13.4` /
          # `flutter: >=3.47.5` and bumped the two pins main's OWN ci.yml has.
          # This job (and `stories`, and probe-guard.yml) is added by this
          # branch, so its pin stayed at 3.47.4 -- Dart 3.13.3 -- and `flutter
          # pub get` could no longer resolve the package at all. The job died
          # before running its gate, which is the worst way for a gate to
          # fail: red for a reason that has nothing to do with what it checks.
          flutter-version: '3.47.5'
          cache: true

      - run: flutter pub get

      # The two drift gates. Each has been observed to exit non-zero against a
      # deliberately broken tree (see 23-03-SUMMARY.md) -- they are gates, not
      # decoration.
      - name: Registry + generated-test freshness
        run: flutter test test/stories/registry_drift_test.dart test/stories/generated_freshness_test.dart

      # SKIPPED on an update_goldens dispatch. A failing step ends the job, and
      # this step fails by definition whenever baselines need regenerating --
      # which is the only reason anyone dispatches update_goldens. Leaving it
      # unconditional made the regeneration path reachable only when it was not
      # needed: two dispatches produced no artifact at all before this was found.
      - name: Story assertions (goldens compared at tolerance 0 on Linux)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_goldens) }}
        run: flutter test test/stories/

      # The ONLY golden-writing path in the repo, and it runs on Linux.
      #
      # `test/stories/_generated/` AND NOT `test/stories/`. The step above was
      # made conditional because it fails by definition whenever baselines need
      # regenerating; the SAME trap was still live one directory down.
      # `test/stories/` also holds golden_uniqueness_test.dart, whose case 1
      # and case 4 fail whenever the committed baseline set is SHORT of the
      # catalogue -- which is exactly the state a dispatch is run from when the
      # reason for it is a NEW story. A failing step ends the job, so the
      # upload below never ran: run 36427143304, dispatched to bless 6 new
      # data-display stories, wrote all 34 baselines to disk and uploaded none
      # of them.
      #
      # Only the files under `_generated/` write goldens. The drift, coverage
      # and uniqueness gates write nothing, and they belong to the GATING step
      # above, where a failure is a verdict. Running them here made a gate over
      # the OLD committed bytes a precondition for producing the new ones.
      # `continue-on-error`, NOT a bare `always()` on the upload below. The
      # difference is the artifact's NAME meaning what it says.
      #
      # `path: test/stories/**/goldens/` matches the COMMITTED baselines
      # whether or not this step wrote a byte, and `if-no-files-found: ignore`
      # suppressed the only warning that could have said so. So an `always()`
      # upload after a step that died BEFORE writing anything -- a failed `pub
      # get`, a compile error in a story, a crash on the first test -- ships
      # the unmodified checkout under the name `regenerated-goldens`, and the
      # next person commits the bytes they already had while believing they
      # re-blessed them. An empty artifact is a visible dead end; a stale one
      # labelled fresh is not.
      #
      # `outcome` and not `conclusion`: with continue-on-error set, a step's
      # `conclusion` is success even when it failed, and only `outcome` still
      # reports what actually happened.
      - name: Regenerate golden baselines (manual dispatch only)
        id: regen
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_goldens }}
        continue-on-error: true
        run: flutter test test/stories/_generated/ --update-goldens

      # WHICH BASELINES ACTUALLY MOVED, in the log, before anything is
      # uploaded. A regeneration that rewrote every file byte-identically and
      # one that never ran are the same artifact; this is the line that tells
      # them apart, and it is what a reviewer checks the committed diff
      # against.
      - name: Report which baselines the regeneration moved
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.update_goldens }}
        run: |
          echo "regenerate step outcome: ${{ steps.regen.outcome }}"
          CHANGED="$(git status --porcelain -- 'test/stories/**/goldens/')"
          if [ -z "$CHANGED" ]; then
            echo "NO baseline changed on disk. Either every story already"
            echo "matched its committed bytes, or nothing was written at all."
          else
            echo "baselines changed on disk:"
            echo "$CHANGED"
          fi

      - name: Upload regenerated goldens
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_goldens && steps.regen.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-goldens
          path: test/stories/**/goldens/
          # `error`, not `ignore`. This path cannot legitimately be empty after
          # a successful regeneration; if it is, the artifact would be an empty
          # download that reads like a successful one.
          if-no-files-found: error

      # THE PARTIAL CASE, UNDER A NAME THAT ADMITS IT. Some of what is on disk
      # may be freshly written and some may be the committed bytes, and nothing
      # here can tell a downloader which is which -- so the name does, and the
      # step above will not have run.
      - name: Upload partially regenerated goldens (regeneration FAILED)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_goldens && steps.regen.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: partial-goldens-DO-NOT-COMMIT-UNVERIFIED
          path: test/stories/**/goldens/
          if-no-files-found: ignore

      # `continue-on-error` must not turn the JOB green. Without this the
      # dispatch reports success while having produced an artifact explicitly
      # named unverified.
      - name: Fail the job when regeneration failed
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_goldens && steps.regen.outcome == 'failure' }}
        run: |
          echo "Golden regeneration FAILED. The artifact uploaded above is"
          echo "named partial-goldens-DO-NOT-COMMIT-UNVERIFIED because some of"
          echo "it may be the unmodified committed baselines. Read the"
          echo "regenerate step's log, fix the failure, dispatch again."
          exit 1

      # flutter_test writes *_masterImage.png / *_testImage.png under
      # failures/ on a golden mismatch; uploading it is what makes a CI golden
      # failure diagnosable instead of just red.
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/stories/**/failures/
          if-no-files-found: ignore
