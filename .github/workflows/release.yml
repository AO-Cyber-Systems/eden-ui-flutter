name: Release

on:
  push:
    branches: [main]

# Workflow default is READ. The write scope belongs to the `release` job alone
# (see below): `test` runs `flutter pub get` and `flutter test`, which execute
# third-party pub package code and build hooks, and `actions/checkout@v4`
# defaults to persist-credentials: true -- so a workflow-level write token is
# written into .git/config on the runner before any dependency code runs.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing in this job talks to GitHub. Without the credential the
          # token is not in .git/config at all while dependency code runs.
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # PINNED to the version CI was already resolving `stable` to, so this
          # changes nothing about what runs today -- it stops the toolchain
          # moving under the repo tomorrow.
          #
          # Why this matters here specifically: correctness in this tree is
          # SDK-dependent. On 3.47.4 ReorderableListView.onReorder is nullable,
          # so `rlv.onReorder!(...)` in eden_route_stop_list_test.dart is
          # REQUIRED; on the older 3.41.4 that same `!` is an
          # unnecessary_non_null_assertion warning. dfe1698 removed it on the
          # strength of a local warning and 30cb437 had to restore it after CI
          # failed with unchecked_use_of_nullable_value. An unpinned channel
          # means a future stable can flip that again through nobody's commit.
          #
          # Do NOT lower this pin without changing that source in the same
          # commit -- they are one decision, not two.
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --no-fatal-infos, matching ci.yml. This job has failed on EVERY merge to
      # main since it was created (#25, #26, #24, #27), so `Tag Release` never
      # ran and no tag has been cut since v1.0.0-rc.1 in April. The cause is 376
      # analyzer INFOS -- 283 of them in test/, which ships to nobody, and 224
      # from prefer_const_* rules this repo opts into itself.
      #
      # ci.yml took --no-fatal-infos deliberately in d883a83 ("unblock
      # baseline ... analyze severity"). The strictness here arrived untouched in
      # the workflow's birth commit 48865d7 and has never once passed. Aligning
      # the outlier with the decision that was actually made.
      #
      # The 376 infos remain as tracked debt; 12 deprecated_member_use in lib/
      # (withOpacity, Radio groupValue/onChanged) have a real SDK deadline and
      # are worth clearing on their own merits.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  release:
    name: Tag Release
    # git push origin "v…" and actions/github-script repos.createRelease.
    permissions:
      contents: write
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create release tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            // AWAITED deliberately. github-script awaits the script body, so an
            // un-awaited promise means this step never checks the API result: a
            // 403 from a wrong permissions scope surfaces as a Node unhandled
            // rejection trace rather than a clean "Resource not accessible by
            // integration". That is the exact failure this job's permissions
            // block could introduce, so it must be the one reported clearly.
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.version.outputs.version }}`,
              name: `v${{ steps.version.outputs.version }}`,
              generate_release_notes: true
            });
