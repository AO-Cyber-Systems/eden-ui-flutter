name: eden_ui_flutter
description: Eden UI component library for Flutter — ported from the Eden UI Rails framework.
version: 2.2.1

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  highlight: ^0.7.0
  flutter_highlight: ^0.7.0
  showcaseview: ^5.0.1
  qr_flutter: ^4.1.0
  # PROMOTION, not a new package. `web` was already resolved transitively at
  # 1.1.1 (via http, itself via google_fonts); declaring it direct changed
  # exactly one line of pubspec.lock -- `dependency: transitive` became
  # `dependency: "direct main"` -- with no version change and no package
  # added. It backs the web-only autofill geometry shim in
  # lib/src/utils/eden_web_autofill_fix_web.dart.
  #
  # web 1.1.1 itself declares `sdk: ^3.4.0`, which the package SDK bound
  # (`^3.13.4`, aligned with Flutter 3.47.5) already satisfies.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # DEV-ONLY, deliberately. Two apps (eden-biz, aodex) pin this library by
  # path/git; anything under `dependencies:` would enter THEIR production
  # resolve. custom_lint and the local `lints/` package are build-time design
  # enforcement and must never leave this repo's dev graph.
  custom_lint: ^0.8.1
  eden_lints:
    path: lints
  # DEV-ONLY for the same reason as custom_lint above, and a PROMOTION rather
  # than a new package: `crypto` was already resolved transitively at 3.0.7,
  # so the resolve moves it from `transitive` to `"direct dev"` with no
  # version change and no package added. (pubspec.lock is gitignored here --
  # this is a library -- so that line is not in any diff; `flutter pub get`
  # then `grep -A1 '^  crypto:' pubspec.lock` is how to see it.)
  #
  # It backs `test/fixtures/agent_intent_fixtures.dart`, which recomputes the
  # vendored eden-biz recordings' set hash. That recipe is SPECIFIED by
  # eden-biz's manifest in terms of sha256 and is computed by Go code in
  # another repo, so the function cannot be substituted the way
  # `golden_uniqueness_test.dart` substitutes base64 for comparing two local
  # files to each other.
  crypto: ^3.0.7

flutter:
  uses-material-design: true
  assets:
    - lib/dev_app/_assets/trades_react_reference/
